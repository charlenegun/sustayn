<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#0a0f1e" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="middle">Sustayn — System Architecture</text>
  <text x="450" y="54" fill="#64748b" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">Retention-Aware Resourcing · IBM AI Builders Challenge</text>

  <!-- ── Row 1: Data sources ── -->
  <!-- Box: IBM HR CSV -->
  <rect x="60" y="80" width="170" height="64" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="145" y="106" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">IBM HR Attrition CSV</text>
  <text x="145" y="121" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">1,470 records · real data</text>
  <text x="145" y="135" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">data/raw/</text>

  <!-- Box: Skills Taxonomy -->
  <rect x="365" y="80" width="170" height="64" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="450" y="106" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Skills Taxonomy</text>
  <text x="450" y="121" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">9 roles → skill tags</text>
  <text x="450" y="135" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">data/synthetic/ · synthetic</text>

  <!-- Box: Open Tasks -->
  <rect x="670" y="80" width="170" height="64" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="755" y="106" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Open Tasks</text>
  <text x="755" y="121" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">18 tasks · required skills</text>
  <text x="755" y="135" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">data/synthetic/ · synthetic</text>

  <!-- Row 1 → Row 2 arrows -->
  <line x1="145" y1="144" x2="145" y2="188" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="144" x2="340" y2="188" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="755" y1="144" x2="640" y2="268" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ── Row 2: Attrition Model ── -->
  <rect x="60" y="192" width="170" height="64" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="1.5"/>
  <text x="145" y="218" fill="#2dd4bf" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Attrition Risk Model</text>
  <text x="145" y="233" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">Logistic Regression</text>
  <text x="145" y="247" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">AUC = 0.79 · model/</text>

  <!-- Attrition model label -->
  <text x="250" y="230" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" font-style="italic">risk scores</text>

  <!-- Row 2 → Row 3 arrows: model + taxonomy → profiles -->
  <line x1="145" y1="256" x2="250" y2="278" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="365" y1="200" x2="320" y2="278" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Row 3: Employee Profiles ── -->
  <rect x="253" y="282" width="200" height="64" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="1.5"/>
  <text x="353" y="308" fill="#2dd4bf" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Employee Profiles</text>
  <text x="353" y="323" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">risk score + skill tags</text>
  <text x="353" y="337" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">+ workload · data/processed/</text>

  <!-- Profiles → Matching Engine -->
  <line x1="453" y1="314" x2="530" y2="314" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Row 3: Matching Engine ── -->
  <rect x="534" y="282" width="200" height="64" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="2"/>
  <text x="634" y="305" fill="#2dd4bf" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Matching Engine</text>
  <text x="634" y="320" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">skill_fit − risk_penalty</text>
  <text x="634" y="334" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">+ availability × 0.3</text>

  <!-- Open tasks dashed line to matching engine -->
  <line x1="755" y1="210" x2="755" y2="282" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="755" y1="282" x2="734" y2="295" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Matching Engine → Explanation Layer -->
  <line x1="634" y1="346" x2="634" y2="380" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Row 4: Explanation Layer ── -->
  <rect x="534" y="384" width="200" height="64" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="634" y="408" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">Explanation Layer</text>
  <text x="634" y="423" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">Claude Haiku · AWS Bedrock</text>
  <text x="634" y="437" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">plain-English reasoning</text>

  <!-- Both → FastAPI -->
  <line x1="534" y1="416" x2="440" y2="416" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="353" y1="346" x2="353" y2="416" stroke="#2dd4bf" stroke-width="1.5"/>
  <line x1="353" y1="416" x2="280" y2="416" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Row 4: FastAPI ── -->
  <rect x="80" y="384" width="200" height="64" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="1.5"/>
  <text x="180" y="408" fill="#2dd4bf" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">FastAPI Backend</text>
  <text x="180" y="423" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">/tasks · /employees</text>
  <text x="180" y="437" fill="#64748b" font-family="system-ui,sans-serif" font-size="9.5" text-anchor="middle">/recommendations · /team-overview</text>

  <!-- FastAPI → React -->
  <line x1="180" y1="448" x2="180" y2="472" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Row 5: React Frontend ── -->
  <rect x="80" y="476" width="654" height="30" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="1.5"/>
  <text x="407" y="496" fill="#2dd4bf" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">React Dashboard (Vite + Tailwind)  ·  Dashboard  /  Task Recommendations  /  Team Overview</text>

  <!-- Legend -->
  <line x1="700" y1="402" x2="720" y2="402" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="724" y="406" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">data flow</text>
  <line x1="700" y1="416" x2="720" y2="416" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="724" y="420" fill="#64748b" font-family="system-ui,sans-serif" font-size="9">synthetic data</text>

  <!-- Real data badge -->
  <rect x="62" y="68" width="38" height="14" rx="3" fill="#1e3a5f"/>
  <text x="81" y="78.5" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">REAL</text>

  <!-- Synthetic badges -->
  <rect x="367" y="68" width="50" height="14" rx="3" fill="#1a2e1a"/>
  <text x="392" y="78.5" fill="#4ade80" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">SYNTHETIC</text>
  <rect x="672" y="68" width="50" height="14" rx="3" fill="#1a2e1a"/>
  <text x="697" y="78.5" fill="#4ade80" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">SYNTHETIC</text>
</svg>
